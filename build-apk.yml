name: Compilar APK Renova tu mente sin conexión

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar componentes Android
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verificar estructura
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/content.json
          echo "Proyecto correcto."

      - name: Compilar APK
        run: gradle assembleDebug --stacktrace

      - name: Verificar APK
        run: |
          find app/build/outputs/apk/debug -name "*.apk" -type f -print
          test -n "$(find app/build/outputs/apk/debug -name '*.apk' -type f)"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Renova-tu-mente-APK-sin-conexion
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
